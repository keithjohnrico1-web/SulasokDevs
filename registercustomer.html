<!DOCTYPE html>
<html>
<head>
    <title>Sun Son Solar - Customer Registration</title>
    <link rel="stylesheet" href="registercustomer.css">
</head>
<body>

    <div class="box">
        <img src="logo.jpg" alt="Sun Son Solar Logo" class="logo">
        
        <h2>Customer Registration</h2>
        
        <div id="successMessage" style="display: none; background-color: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center; font-size: 14px;"></div>

        <form id="customerForm" action="registercustomer.php" method="POST">
            <div class="form-grid">
                <div class="form-group">
                    <label>First Name:</label>
                    <input type="text" name="firstname" required>
                </div>

                <div class="form-group">
                    <label>Middle Name:</label>
                    <input type="text" name="middlename">
                </div>

                <div class="form-group">
                    <label>Last Name:</label>
                    <input type="text" name="lastname" required>
                </div>

                <div class="form-group">
                    <label>Birthdate:</label>
                    <input type="date" name="birthdate" required>
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <select name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="tel" name="phone" required>
                </div>

                <div class="form-group full-width">
                    <label>Email Address:</label>
                    <input type="email" name="email" required>
                </div>

                <div class="form-group full-width">
                    <label>Address:</label>
                    <input type="text" name="address" required>
                </div>

                <div class="form-group">
                    <label>Username:</label>
                    <input type="text" name="username" required>
                </div>

                <div class="form-group">
                    <label>Password:</label>
                    <input type="password" name="password" required>
                </div>
            </div>

            <button type="submit">Register as Customer</button>
        </form>

        <div class="switch-link">
            <a href="registeremployee.html">Register as an Employee instead</a>
        </div>
    </div>

    <script>
        document.getElementById('customerForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            let formData = new FormData(this);

            fetch('registercustomer.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                let msgDiv = document.getElementById('successMessage');
                msgDiv.style.display = 'block';
                msgDiv.innerText = "Successfully registered!";
                
             
                document.getElementById('customerForm').reset();
            })
            .catch(error => {
                alert('An error occurred during registration.');
            });
        });
    </script>

</body>
</html>
